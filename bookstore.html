<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bookstore</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "poppins", sans-serif;
      }

      body {
        background: #0f172a;
        color: white;
      }

      /* Navbar*/

      .navbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 20px 50px;
        background: rgba(15, 23, 42, 0.95);
        position: sticky;
        top: 0;
        z-index: 100;
      }

      .navbar h1 {
        color: #38bdf8;
        font-size: 32px;
      }

      .cart {
        background: #38bdf8;
        color: #000;
        padding: 10px 18px;
        border-radius: 30px;
        font-weight: bold;
      }

      .cart span {
        background: #000;
        color: white;
        padding: 3px 8px;
        border-radius: 50%;
        margin-left: 5px;
      }

      /* Hero */

      .hero {
        height: 60vh;
        background: url("blue landscape.jpg") no-repeat center center/cover;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .overlay {
        background: rgba(0, 0, 0, 0.6);
        padding: 50px;
        text-align: center;
        border-radius: 20px;
      }

      .overlay h2 {
        font-size: 52px;
        margin-bottom: 15px;
      }

      .overlay p {
        font-size: 20px;
        margin-bottom: 20px;
      }

      .overlay button {
        background: #38bdf8;
        color: black;
        padding: 14px 30px;
        border: none;
        border-radius: 40px;
        font-size: 18px;
        cursor: pointer;
        transition: 0.3s;
      }

      .overlay button:hover {
        transform: scale(1.05);
      }

      /* Books */

      .books-container {
        padding: 60px;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 35px;
      }

      .book-card {
        background: #1e293b;
        border-radius: 20px;
        overflow: hidden;
        transition: 0.4s;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      }

      .book-card:hover {
        transform: translateY(-10px);
      }

      .book-card img {
        width: 100%;
        height: 350px;
        object-fit: cover;
      }

      .book-info {
        padding: 20px;
      }

      .book-info h3 {
        font-size: 24px;
        margin-bottom: 8px;
      }
      .book-info p {
        font-size: 24px;
        margin-bottom: 8px;
      }

      .price {
        color: #38bdf8;
        font-size: 22px;
        font-weight: bold;
        margin-bottom: 20px;
      }
      .buttons {
        display: flex;
        gap: 10px;
      }
      .buy-btn,
      .read-btn {
        flex: 1;
        padding: 12px;
        border: none;
        border-radius: 10px;
        font-size: 16px;
        cursor: pointer;
        transition: 0.3s;
      }
      .buy-btn {
        background: #38bdf8;
        color: black;
        font-weight: bold;
      }
      .buy-btn:hover {
        background: #0ea5e9;
      }

      .read-btn {
        background: transparent;
        border: 2px solid #38bdf8;
        color: white;
      }
      .read-btn:hover {
        background: #38bdf8;
        color: black;
      }
      /*Responsive*/

      @media (max-width: 760px) {
        .overlay h2 {
          font-size: 36px;
        }
        .books-container {
          padding: 20px;
        }
        .navbar {
          padding: 20px;
        }
      }
    </style>
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar">
      <h1>📚 BookVerse</h1>

      <div class="cart">🛒 Cart <span>0</span></div>
    </nav>

    <!-- Hero Section -->
    <section class="hero">
      <div class="overlay">
        <h2>Discover Amazing Books</h2>
        <p>Buy and read your favorite books online</p>
        <button>Explore Now</button>
      </div>
    </section>

    <!-- Books -->
    <div class="books-container">
      <!-- Book 1 -->
      <div class="book-card">
        <img src="img1.jpg" alt="Twisted Love" />

        <div class="book-info">
          <h3>Twisted Love</h3>
          <p>Ana Huang</p>

          <div class="price">$12</div>

          <div class="buttons">
            <button class="buy-btn">Buy</button>
            <button class="read-btn">Read</button>
          </div>
        </div>
      </div>

      <!-- Book 2 -->
      <div class="book-card">
        <img src="img2.jpg" alt="Future of AI" />

        <div class="book-info">
          <h3>Future of AI</h3>
          <p>Daniel Smith</p>

          <div class="price">$18</div>

          <div class="buttons">
            <button class="buy-btn">Buy</button>
            <button class="read-btn">Read</button>
          </div>
        </div>
      </div>

      <!-- Book 3 -->
      <div class="book-card">
        <img src="img3.jpg" alt="It Ends With Us" />

        <div class="book-info">
          <h3>It Ends With Us</h3>
          <p>Colleen Hoover</p>

          <div class="price">$15</div>

          <div class="buttons">
            <button class="buy-btn">Buy</button>
            <button class="read-btn">Read</button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
